<div class="min-h-screen bg-zinc-950 flex flex-col">
  <app-navbar />
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
    <router-outlet />
  </main>
  <footer class="app-footer py-6">
    <nav
      class="max-w-7xl mx-auto px-4 sm:px-6 mb-5 flex flex-wrap justify-center gap-x-4 gap-y-2 text-xs text-slate-600"
      aria-label="Secciones del sitio"
    >
      @for (link of footerLinks; track link.path) {
        <a [routerLink]="link.path" class="hover:text-slate-400 transition-colors">{{ link.label }}</a>
      }
    </nav>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center text-xs text-slate-600">
      Dólar en Vivo — desarrollado por
      <a
        href="https://www.linkedin.com/in/patriciocarestia/"
        target="_blank"
        rel="noopener noreferrer"
        class="text-slate-400 hover:text-white underline underline-offset-2 transition-colors"
      >
        Patricio Carestia
      </a>
      ·
      <a
        href="https://github.com/patriciocarestia/dolar-en-vivo"
        target="_blank"
        rel="noopener noreferrer"
        class="text-slate-400 hover:text-white underline underline-offset-2 transition-colors"
      >
        GitHub
      </a>
    </div>
  </footer>
</div>
